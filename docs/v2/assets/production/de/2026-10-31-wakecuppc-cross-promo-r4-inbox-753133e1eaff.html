<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;none&#39;; connect-src &#39;none&#39;; style-src &#39;unsafe-inline&#39;; img-src data:; font-src &#39;none&#39;; frame-src &#39;none&#39;; form-action &#39;none&#39;; base-uri &#39;none&#39;"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071914}*,*:before,*:after{box-sizing:border-box}</style></head><body><style>
*{box-sizing:border-box}
:root{color-scheme:dark}
.wc{--bg:#0B1016;--surface:#121922;--raised:#1B2530;--border:#2A3745;--blue:#4C84FF;--cyan:#15DBF7;--green:#4ADE9B;--fg:#F7F9FC;--muted:#9CAABA;position:relative;width:100%;height:100%;background:radial-gradient(ellipse at 88% 8%,#152b47 0%,#0b1016 49%,#080c11 100%);color:var(--fg);overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;isolation:isolate}
.wc:before{content:"";position:absolute;width:65%;height:70%;right:-18%;top:-16%;border-radius:50%;border:1px solid #4C84FF35;box-shadow:0 0 65px #4C84FF1a,inset 0 0 65px #4C84FF16;pointer-events:none}
.wc:after{content:"";position:absolute;width:70%;height:1px;left:15%;bottom:0;background:linear-gradient(90deg,transparent,#4C84FF68,transparent)}
.brand{display:flex;align-items:center;gap:11px;position:relative;z-index:2;min-width:0}
.brandname{font-size:clamp(22px,6vw,30px);font-weight:950;letter-spacing:-.06em;line-height:1}.brandname b{font-weight:950;color:var(--cyan)}
.brandnote{font-size:9px;letter-spacing:.15em;font-weight:800;color:#92A6BD;margin-top:6px}
.mascot{display:block;width:50px;height:51px;flex:none;position:relative;filter:drop-shadow(0 3px 11px #4C84FF28)}
.mascot .bezel{position:absolute;left:9%;top:8%;width:81%;height:67%;border:4px solid var(--blue);border-radius:10px;background:var(--raised);box-shadow:inset 0 0 0 3px #0C1825}
.mascot .eye{position:absolute;top:31%;width:5px;height:5px;border-radius:50%;background:var(--fg)}.mascot .eye.a{left:31%}.mascot .eye.b{left:60%}
.mascot .smile{position:absolute;top:43%;left:35%;width:26%;height:13%;border-bottom:3px solid var(--fg);border-radius:0 0 50% 50%;transform:rotate(-3deg)}
.mascot .stem{position:absolute;left:47%;top:75%;width:4px;height:12%;background:#94A3B8}.mascot .foot{position:absolute;left:27%;top:84%;width:42%;height:4px;border-radius:5px;background:#94A3B8}
.mascot .cup{position:absolute;right:0;bottom:18%;width:17px;height:15px;border:3px solid #FFC857;background:#E9A83E;border-radius:3px 3px 5px 5px;box-shadow:0 0 0 2px #17202D}.mascot .cup:after{content:"";position:absolute;left:100%;top:0;width:6px;height:8px;border:2px solid #FFC857;border-left:0;border-radius:0 6px 6px 0}
.mascot .steam{position:absolute;right:12%;top:1%;height:8px;width:4px;border-left:2px solid #FFC857;border-radius:50%;transform:rotate(16deg)}
.copy{position:relative;z-index:2;min-width:0}.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.17em;color:#83BAFF}.eyebrow:before{content:"";height:6px;width:6px;background:var(--blue);border-radius:50%;box-shadow:0 0 12px #4C84FF91}
.title{font-size:clamp(27px,8vw,46px);line-height:1.06;letter-spacing:-.045em;font-weight:900;margin:8px 0;color:var(--fg);text-wrap:balance}
.deck{font-size:clamp(11px,2.75vw,14px);line-height:1.35;color:#BCCBD9;margin:0;max-width:100%;text-wrap:pretty}
.ui{position:relative;background:linear-gradient(155deg,#172231,#121922 57%,#101820);border:1px solid #33435A;border-radius:17px;box-shadow:0 12px 30px #0005,0 0 34px #4C84FF13;overflow:hidden;min-height:0}
.ui:before{content:"";position:absolute;left:16%;top:0;width:60%;height:1px;background:linear-gradient(90deg,transparent,#4C84FF88,transparent)}
.device{display:flex;align-items:center;gap:10px;min-width:0;padding:12px 13px 8px;border-bottom:1px solid #2A3745}.mini{height:31px;width:36px;border:2px solid #4C84FF;border-radius:7px;position:relative;flex:none;background:#1B2530}.mini:before{content:"••";position:absolute;color:#F7F9FC;font-size:11px;letter-spacing:3px;left:8px;top:1px}.mini:after{content:"";position:absolute;left:11px;top:13px;width:11px;height:8px;border-bottom:2px solid #F7F9FC;border-radius:0 0 50% 50%}
.identity{min-width:0;flex:1}.pcname{font-size:13px;font-weight:900;white-space:nowrap}.pcsub{color:var(--green);font-size:10px;font-weight:750;margin-top:3px;display:flex;align-items:center;gap:6px}.pcsub:before{content:"";width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 9px #4ADE9B}
.actiontile{width:40px;height:36px;border:2px solid #4ADE9B;border-radius:10px;background:#4ADE9B17;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #4ADE9B1a;flex:none}.actiontile span{height:10px;width:17px;border:3px solid var(--green);border-top:0;border-radius:0 0 10px 10px;position:relative}.actiontile span:after{content:"";position:absolute;left:7px;bottom:10px;width:3px;height:7px;background:var(--green);border-radius:4px}
.activity{display:flex;align-items:center;gap:9px;padding:10px 13px}.track{height:9px;background:#303C4E;border:1px solid #435064;border-radius:99px;min-width:0;flex:1;overflow:hidden}.fill{height:100%;width:80%;background:linear-gradient(90deg,#3678FF,#4C84FF,#65BCFF);border-radius:99px;box-shadow:0 0 10px #4C84FF66;animation:recharge 4.5s ease-in-out infinite}.activitydot{width:9px;height:9px;background:#4ADE9B;border-radius:50%;box-shadow:0 0 10px #4ADE9B6e;flex:none}.activitytext{font-size:10px;color:#9CAABA;font-weight:850;letter-spacing:.04em}
@keyframes recharge{0%,15%,85%,100%{width:96%}55%{width:74%}}
@media(prefers-reduced-motion:reduce){.fill{animation:none;width:88%}}
.cta{display:inline-block;position:relative;z-index:2;background:#4C84FF;color:#fff;border-radius:11px;padding:11px 15px;text-decoration:none;font-weight:850;font-size:12px;box-shadow:0 5px 20px #2F72FF33;max-width:max-content}
.footer{color:#8AA3C6;font-size:9px;letter-spacing:.15em;font-weight:800}
/* Portrait: true 4:5 editorial poster, copy + actual Keep Awake design language */
.poster{display:flex;flex-direction:column;padding:6%;gap:11px}
.poster .ui{flex:none}.poster .panel{position:relative;display:flex;align-items:center;gap:8px;min-height:26px;padding:0 13px 9px}.poster .panel b{font-size:10px;color:#D7E0E9}.poster .panel .state{margin-left:auto;font-size:9px;color:var(--green);font-weight:900;letter-spacing:.08em}
.poster .bottom{margin-top:auto;display:flex;align-items:center;justify-content:flex-start;gap:10px}
/* Wide inbox: independent horizontal composition, very limited copy */
.banner{display:grid;grid-template-columns:minmax(0,1.07fr) minmax(0,.93fr);align-items:center;padding:6%;gap:12px}
.banner .brand{gap:7px}.banner .mascot{transform:scale(.68);transform-origin:left center;margin-right:-13px;width:41px;height:43px}.banner .brandname{font-size:clamp(18px,5.2vw,29px)}
.banner .title{font-size:clamp(18px,5.2vw,31px);margin:12px 0 0;line-height:1.05}
.banner .ui{transform:rotate(-2deg);border-radius:12px}.banner .device{padding:9px;gap:6px}.banner .mini{width:29px;height:27px}.banner .mini:before{left:6px;top:0}.banner .mini:after{left:9px;top:11px}.banner .pcname{font-size:11px}.banner .pcsub{font-size:9px}.banner .actiontile{display:none}.banner .activity{padding:7px 9px}.banner .activitytext{font-size:9px}
.banner .footer{position:absolute;left:6%;bottom:8%;font-size:8px}
@media (max-width:370px){.poster{gap:8px;padding:5.8%}.poster .brand .mascot{transform:scale(.87);transform-origin:left center;margin-right:-6px}.poster .brandname{font-size:24px}.poster .title{font-size:29px;margin:6px 0}.poster .deck{font-size:11px;line-height:1.31}.poster .device{padding:9px 11px 7px}.poster .activity{padding:8px 11px}.poster .panel{padding-bottom:7px}.poster .bottom{padding-top:0}.banner{gap:7px}.banner .ui{transform:none}.banner .title{font-size:20px}.banner .brandname{font-size:19px}}
</style><section class="wc banner"><div class="copy"><div class="brand"><span class="mascot" aria-hidden="true"><span class="bezel"></span><span class="eye a"></span><span class="eye b"></span><span class="smile"></span><span class="stem"></span><span class="foot"></span><span class="steam"></span><span class="cup"></span></span><div><div class="brandname">WakeCup<b>PC</b></div><div class="brandnote">BLUETOOTH HID</div></div></div><h2 class="title">Dein PC bleibt aktiv.</h2></div><div class="ui" aria-hidden="true"><div class="device"><div class="mini"></div><div class="identity"><div class="pcname">WORK PC</div><div class="pcsub">Connected</div></div><div class="actiontile"><span></span></div></div><div class="activity"><span class="activitydot"></span><div class="track"><div class="fill"></div></div><span class="activitytext">ON</span></div></div></section></body></html>
